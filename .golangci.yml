version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert
    - unparam
  settings:
    errcheck:
      check-type-assertions: true
  exclusions:
    rules:
      # Tests may ignore errors from cleanup calls.
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
